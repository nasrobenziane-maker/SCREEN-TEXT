name: Build ScreenText EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download Arabic and English OCR models
        shell: pwsh
        run: .\prepare-ocr-data.ps1

      - name: Publish single-file EXE
        run: dotnet publish .\ScreenText.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o .\publish

      - name: Upload app and notices
        uses: actions/upload-artifact@v4
        with:
          name: ScreenText-win-x64
          path: .\publish\*
          if-no-files-found: error
